<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cataloghi Cantine - Viticoltura Erotica</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Poppins & Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        veBrand: '#c2410c',
                        veBrandHover: '#9a3412',
                        veDark: '#291811'
                    },
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        poppins: ['Poppins', 'sans-serif']
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-[#54b2f8] text-gray-800 font-sans min-h-screen">

    <!-- Header con Logotipo e Slogan (sfondo #f9fb04) -->
    <header class="bg-[#f9fb04] border-b-2 border-black/10 py-6 px-4 mb-8 shadow-md">
        <div class="max-w-7xl mx-auto flex flex-col items-center justify-center text-center">
            <!-- Immagine del Logotipo -->
            <img src="https://lh3.googleusercontent.com/d/1YObZA27aih0oEZ3R3tqk7vWG3AUrMggV=s800" alt="Viticoltura Erotica" class="h-14 md:h-16 w-auto object-contain mb-2">
            <p class="text-sm md:text-base font-semibold tracking-wide text-gray-900 italic">"Tutto, proprio tutto il vino che vendo, ma sopratutto quello che non riesco a vendere"</p>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 pb-12">
        
        <!-- Sezione Filtri e Ricerca -->
        <div class="bg-white/95 backdrop-blur-sm p-6 rounded-2xl shadow-lg border border-white/40 mb-8 space-y-5">
            
            <!-- Ricerca e Zona -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Cerca Cantina</label>
                    <input type="text" id="searchName" placeholder="Es. nome, vitigno, parola chiave..." class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-veBrand focus:outline-none transition-all">
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Filtra per Zona</label>
                    <select id="filterZona" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-veBrand focus:outline-none transition-all">
                        <option value="">Tutte le zone</option>
                    </select>
                </div>
            </div>

            <!-- Pulsanti Nazione -->
            <div class="pt-3 border-t border-gray-100">
                <span class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Filtra per Nazione</span>
                <div id="nationButtonsContainer" class="flex flex-wrap gap-2">
                    <!-- Generati dinamicamente -->
                </div>
            </div>

            <!-- Pulsanti Catalogo e Reset -->
            <div class="pt-3 border-t border-gray-100 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                <div class="w-full md:w-auto">
                    <span class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Filtra per Catalogo</span>
                    <div id="catalogButtonsContainer" class="flex flex-wrap gap-2">
                        <!-- Generati dinamicamente -->
                    </div>
                </div>

                <div class="w-full md:w-48 self-end">
                    <button id="resetBtn" class="w-full bg-orange-100/70 hover:bg-orange-200 text-orange-900 font-semibold py-2.5 px-4 rounded-xl text-sm transition-colors shadow-xs">
                        Resetta Filtri
                    </button>
                </div>
            </div>
        </div>

        <!-- Griglia Cantine -->
        <div id="gridContainer" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Card generate dinamicamente -->
        </div>

        <!-- Messaggio nessun risultato -->
        <div id="noResults" class="hidden text-center py-16 text-white font-medium text-lg drop-shadow-xs">
            Nessuna cantina corrisponde ai filtri selezionati.
        </div>

    </main>

    <!-- Modale / Pop-up per la Descrizione -->
    <div id="detailModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-xs p-4">
        <div class="bg-white rounded-3xl shadow-2xl max-w-lg w-full p-6 relative transform transition-all border border-[#f991e8] font-poppins">
            <button id="closeModalBtn" class="absolute top-4 right-4 text-gray-400 hover:text-gray-700 bg-orange-50 hover:bg-orange-100 rounded-full p-2 w-9 h-9 flex items-center justify-center transition-colors">
                ✕
            </button>
            <div id="modalContent">
                <!-- Contenuto pop-up -->
            </div>
        </div>
    </div>

    <!-- Script -->
    <script>
        const SPREADSHEET_ID = '1TIFiheYx9fES0ZENGtDeZ6JCgY4Ll-qpRYdXTWZIqK0';
        const SHEET_NAMES = ['Giacimenti', 'Diretti', 'COVIBIO'];
        
        let allData = [];
        let loadedSheets = 0;
        let activeCatalog = '';
        let activeNation = '';

        const COLOR_PALETTE = [
            { bg: 'bg-rose-100', text: 'text-rose-900', border: 'border-rose-300', activeBg: 'bg-rose-600', activeText: 'text-white' },
            { bg: 'bg-amber-100', text: 'text-amber-900', border: 'border-amber-300', activeBg: 'bg-amber-600', activeText: 'text-white' },
            { bg: 'bg-emerald-100', text: 'text-emerald-900', border: 'border-emerald-300', activeBg: 'bg-emerald-600', activeText: 'text-white' },
            { bg: 'bg-sky-100', text: 'text-sky-900', border: 'border-sky-300', activeBg: 'bg-sky-600', activeText: 'text-white' },
            { bg: 'bg-purple-100', text: 'text-purple-900', border: 'border-purple-300', activeBg: 'bg-purple-600', activeText: 'text-white' },
            { bg: 'bg-pink-100', text: 'text-pink-900', border: 'border-pink-300', activeBg: 'bg-pink-600', activeText: 'text-white' },
            { bg: 'bg-teal-100', text: 'text-teal-900', border: 'border-teal-300', activeBg: 'bg-teal-600', activeText: 'text-white' },
            { bg: 'bg-indigo-100', text: 'text-indigo-900', border: 'border-indigo-300', activeBg: 'bg-indigo-600', activeText: 'text-white' }
        ];

        const nationColorMap = {};
        const catalogColorMap = {};

        function getColorMapping(value, mapObj) {
            if (!value) return { bg: 'bg-gray-100', text: 'text-gray-800', border: 'border-gray-300', activeBg: 'bg-gray-800', activeText: 'text-white' };
            if (!mapObj[value]) {
                const assignedIndex = Object.keys(mapObj).length % COLOR_PALETTE.length;
                mapObj[value] = COLOR_PALETTE[assignedIndex];
            }
            return mapObj[value];
        }

        function parseSheetResponse(data, sheetName) {
            if (!data || !data.table || !data.table.rows) {
                console.warn(`Foglio ${sheetName}: Nessun dato trovato.`);
                return [];
            }
            const rows = data.table.rows;

            return rows.map(row => {
                const getVal = (idx) => (row.c && row.c[idx] && row.c[idx].v !== null) ? String(row.c[idx].v).trim() : '';

                return {
                    catalogo: getVal(0),
                    nome: getVal(1),
                    nazione: getVal(2),
                    zona: getVal(3),
                    descrizione: getVal(4),
                    tags: getVal(5)
                };
            }).filter(item => {
                const cleanName = item.nome.toLowerCase();
                if (!cleanName || cleanName === 'nome' || cleanName === 'nome cantina' || cleanName === 'catalogo') {
                    return false;
                }
                return true;
            });
        }

        SHEET_NAMES.forEach(sheetName => {
            window['cb' + sheetName] = function(data) {
                const parsed = parseSheetResponse(data, sheetName);
                allData = allData.concat(parsed);
                checkComplete();
            };
        });

        function checkComplete() {
            loadedSheets++;
            if (loadedSheets === SHEET_NAMES.length) {
                initApp(allData);
            }
        }

        function loadSheetData() {
            SHEET_NAMES.forEach(sheetName => {
                const script = document.createElement('script');
                script.src = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=responseHandler:cb${sheetName}&sheet=${sheetName}&t=${Date.now()}`;
                document.body.appendChild(script);
            });
        }

        function initApp(data) {
            populateFilters(data);
            renderCards(data);

            document.getElementById('searchName').addEventListener('input', filterAndRender);
            document.getElementById('filterZona').addEventListener('change', filterAndRender);
            
            document.getElementById('resetBtn').addEventListener('click', () => {
                document.getElementById('searchName').value = '';
                document.getElementById('filterZona').value = '';
                activeCatalog = '';
                activeNation = '';
                updateAllButtonsStyle();
                renderCards(allData);
            });

            document.getElementById('closeModalBtn').addEventListener('click', closeModal);
            document.getElementById('detailModal').addEventListener('click', (e) => {
                if (e.target.id === 'detailModal') closeModal();
            });
        }

        function populateFilters(data) {
            const zone = [...new Set(data.map(item => item.zona).filter(Boolean))].sort();
            const zonaSelect = document.getElementById('filterZona');
            zonaSelect.innerHTML = '<option value="">Tutte le zone</option>';
            zone.forEach(z => {
                const opt = document.createElement('option');
                opt.value = z;
                opt.textContent = z;
                zonaSelect.appendChild(opt);
            });

            const nazioni = [...new Set(data.map(item => item.nazione).filter(Boolean))].sort();
            const natContainer = document.getElementById('nationButtonsContainer');
            natContainer.innerHTML = '';

            const allNatBtn = document.createElement('button');
            allNatBtn.className = 'nation-btn px-4 py-1.5 rounded-full text-xs font-bold transition-all bg-slate-900 text-white shadow-xs';
            allNatBtn.textContent = 'Tutte';
            allNatBtn.dataset.nation = '';
            allNatBtn.addEventListener('click', () => {
                activeNation = '';
                updateAllButtonsStyle();
                filterAndRender();
            });
            natContainer.appendChild(allNatBtn);

            nazioni.forEach(n => {
                const col = getColorMapping(n, nationColorMap);
                const btn = document.createElement('button');
                btn.className = `nation-btn px-4 py-1.5 rounded-full text-xs font-semibold transition-all ${col.bg} ${col.text} hover:opacity-80`;
                btn.textContent = n;
                btn.dataset.nation = n;
                btn.addEventListener('click', () => {
                    activeNation = n;
                    updateAllButtonsStyle();
                    filterAndRender();
                });
                natContainer.appendChild(btn);
            });

            const cataloghi = [...new Set(data.map(item => item.catalogo).filter(Boolean))].sort();
            const catContainer = document.getElementById('catalogButtonsContainer');
            catContainer.innerHTML = '';

            const allCatBtn = document.createElement('button');
            allCatBtn.className = 'catalog-btn px-4 py-1.5 rounded-full text-xs font-bold transition-all bg-slate-900 text-white shadow-xs';
            allCatBtn.textContent = 'Tutti';
            allCatBtn.dataset.catalog = '';
            allCatBtn.addEventListener('click', () => {
                activeCatalog = '';
                updateAllButtonsStyle();
                filterAndRender();
            });
            catContainer.appendChild(allCatBtn);

            cataloghi.forEach(cat => {
                const col = getColorMapping(cat, catalogColorMap);
                const btn = document.createElement('button');
                btn.className = `catalog-btn px-4 py-1.5 rounded-full text-xs font-semibold transition-all ${col.bg} ${col.text} hover:opacity-80`;
                btn.textContent = cat;
                btn.dataset.catalog = cat;
                btn.addEventListener('click', () => {
                    activeCatalog = cat;
                    updateAllButtonsStyle();
                    filterAndRender();
                });
                catContainer.appendChild(btn);
            });
        }

        function updateAllButtonsStyle() {
            document.querySelectorAll('.nation-btn').forEach(btn => {
                const val = btn.dataset.nation;
                if (val === activeNation) {
                    btn.className = 'nation-btn px-4 py-1.5 rounded-full text-xs font-bold transition-all bg-slate-900 text-white shadow-xs';
                } else if (val === '') {
                    btn.className = 'nation-btn px-4 py-1.5 rounded-full text-xs font-bold transition-all ' + (activeNation === '' ? 'bg-slate-900 text-white shadow-xs' : 'bg-gray-100 text-gray-700 hover:bg-gray-200');
                } else {
                    const col = getColorMapping(val, nationColorMap);
                    btn.className = `nation-btn px-4 py-1.5 rounded-full text-xs font-semibold transition-all ${col.bg} ${col.text} hover:opacity-80`;
                }
            });

            document.querySelectorAll('.catalog-btn').forEach(btn => {
                const val = btn.dataset.catalog;
                if (val === activeCatalog) {
                    btn.className = 'catalog-btn px-4 py-1.5 rounded-full text-xs font-bold transition-all bg-slate-900 text-white shadow-xs';
                } else if (val === '') {
                    btn.className = 'catalog-btn px-4 py-1.5 rounded-full text-xs font-bold transition-all ' + (activeCatalog === '' ? 'bg-slate-900 text-white shadow-xs' : 'bg-gray-100 text-gray-700 hover:bg-gray-200');
                } else {
                    const col = getColorMapping(val, catalogColorMap);
                    btn.className = `catalog-btn px-4 py-1.5 rounded-full text-xs font-semibold transition-all ${col.bg} ${col.text} hover:opacity-80`;
                }
            });
        }

        function filterAndRender() {
            const searchText = document.getElementById('searchName').value.toLowerCase();
            const selectedZona = document.getElementById('filterZona').value;

            const filtered = allData.filter(item => {
                const searchPool = `${item.nome} ${item.tags} ${item.zona} ${item.nazione}`.toLowerCase();
                
                const matchSearch = !searchText || searchPool.includes(searchText);
                const matchNat = !activeNation || item.nazione === activeNation;
                const matchZona = !selectedZona || item.zona === selectedZona;
                const matchCat = !activeCatalog || item.catalogo === activeCatalog;
                return matchSearch && matchNat && matchZona && matchCat;
            });

            renderCards(filtered);
        }

        function renderCards(data) {
            const container = document.getElementById('gridContainer');
            const noResults = document.getElementById('noResults');
            
            container.innerHTML = '';

            if (data.length === 0) {
                noResults.classList.remove('hidden');
                return;
            } else {
                noResults.classList.add('hidden');
            }

            data.forEach(item => {
                const card = document.createElement('div');
                card.className = 'bg-white rounded-2xl shadow-md border-2 border-[#f991e8] p-6 flex flex-col justify-between hover:shadow-lg transition-all relative cursor-pointer group font-poppins';

                const natCol = getColorMapping(item.nazione, nationColorMap);
                const catCol = getColorMapping(item.catalogo, catalogColorMap);

                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start mb-3 gap-2">
                            <span class="text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider ${natCol.bg} ${natCol.text}">${item.nazione || 'N/D'}</span>
                            <span class="text-[11px] px-3 py-1 rounded-full font-semibold ${catCol.bg} ${catCol.text}">
                                ${item.catalogo || 'Generale'}
                            </span>
                        </div>
                        <h3 class="text-xl font-bold text-gray-900 mb-1 group-hover:text-veBrand transition-colors">${item.nome}</h3>
                        ${item.zona ? `<p class="text-sm font-medium text-gray-500">📍 ${item.zona}</p>` : ''}
                    </div>
                    <div class="mt-4 pt-3 border-t border-gray-100 flex justify-end">
                        <span class="text-xs font-semibold text-orange-400 group-hover:text-veBrand transition-colors">Tocca per dettagli →</span>
                    </div>
                `;

                card.addEventListener('click', () => {
                    openModal(item, natCol, catCol);
                });

                container.appendChild(card);
            });
        }

        function openModal(item, natCol, catCol) {
            const modal = document.getElementById('detailModal');
            const content = document.getElementById('modalContent');

            content.innerHTML = `
                <div class="flex justify-between items-start mb-4 pr-6 gap-2">
                    <span class="text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider ${natCol.bg} ${natCol.text}">${item.nazione || 'N/D'}</span>
                    <span class="text-xs px-3.5 py-1 rounded-full font-semibold shadow-xs ${catCol.bg} ${catCol.text}">
                        ${item.catalogo || 'Generale'}
                    </span>
                </div>
                <h2 class="text-2xl font-bold text-gray-900 mb-2">${item.nome}</h2>
                ${item.zona ? `<p class="text-sm font-medium text-gray-600 mb-4">📍 ${item.zona}</p>` : ''}
                <div class="mt-4 pt-4 border-t border-gray-100">
                    <h4 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Descrizione</h4>
                    <p class="text-sm text-gray-700 leading-relaxed">${item.descrizione || 'Nessuna descrizione disponibile per questa cantina.'}</p>
                </div>
            `;

            modal.classList.remove('hidden');
        }

        function closeModal() {
            const modal = document.getElementById('detailModal');
            modal.classList.add('hidden');
        }

        loadSheetData();
    </script>
</body>
</html>
